# Opt-in LAN presentation mode. The base compose file remains localhost-only.
services:
  web:
    ports:
      - "${LAN_BIND_IP:?Set LAN_BIND_IP to this computer's private LAN IPv4 address}:8514:80"
    volumes:
      - ./web/nginx.lan.conf:/etc/nginx/conf.d/default.conf:ro
  web-local:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8515:80"
    depends_on:
      api:
        condition: service_healthy
